<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title description">
  <title id="title">Adaptive Tutor lesson journey</title>
  <desc id="description">A glowing path travels from a question to confidence through four learning milestones.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#151b2f"/><stop offset="100%" stop-color="#27233e"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f6bd60"/><stop offset="50%" stop-color="#f28482"/><stop offset="100%" stop-color="#84dcc6"/></linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .path { stroke-dasharray: 820; stroke-dashoffset: 820; animation: write 7s ease-in-out infinite; }
      .traveler { animation: travel 7s ease-in-out infinite; }
      .note { opacity: 0; animation: note 7s ease-in-out infinite; }
      .n1 { animation-delay: .6s; } .n2 { animation-delay: 1.7s; } .n3 { animation-delay: 2.8s; } .n4 { animation-delay: 3.9s; }
      .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 2.3s ease-out infinite; }
      @keyframes write { 0%, 7% { stroke-dashoffset: 820; } 68%, 100% { stroke-dashoffset: 0; } }
      @keyframes travel { 0%, 10% { transform: translate(0 0); opacity: 0; } 15% { opacity: 1; } 82%, 100% { transform: translate(700px -24px); opacity: 0; } }
      @keyframes note { 0%, 18% { opacity: 0; transform: translateY(4px); } 25%, 74% { opacity: 1; transform: translateY(0); } 84%, 100% { opacity: 0; } }
      @keyframes ripple { 0% { opacity: .9; transform: scale(.35); } 100% { opacity: 0; transform: scale(1.8); } }
    </style>
  </defs>
  <rect width="960" height="280" rx="20" fill="url(#paper)"/>
  <g opacity=".17" stroke="#d9d4e7" stroke-width="1"><path d="M0 46H960M0 92H960M0 138H960M0 184H960M0 230H960"/><path d="M40 0V280M120 0V280M200 0V280M280 0V280M360 0V280M440 0V280M520 0V280M600 0V280M680 0V280M760 0V280M840 0V280M920 0V280"/></g>
  <text x="48" y="53" fill="#f6bd60" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2.4">THE LESSON MOVES WHEN UNDERSTANDING DOES</text>
  <text x="48" y="106" fill="#fffaf4" font-family="ui-serif, Georgia, serif" font-size="50" font-weight="700">Adaptive Tutor</text>
  <text x="48" y="138" fill="#d9d4e7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">A guided trail from first question to usable confidence.</text>
  <path class="path" d="M90 209 C170 170 228 236 305 208 S440 174 510 212 S646 250 710 194 S810 159 874 197" fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <g class="traveler"><circle cx="90" cy="209" r="7" fill="#fffaf4" filter="url(#glow)"/><circle cx="90" cy="209" r="13" fill="none" stroke="#f6bd60" stroke-width="1.5" class="ripple"/></g>
  <g class="note n1"><circle cx="90" cy="209" r="7" fill="#f6bd60"/><text x="90" y="249" text-anchor="middle" fill="#fffaf4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">QUESTION</text></g>
  <g class="note n2"><circle cx="305" cy="208" r="7" fill="#f28482"/><text x="305" y="177" text-anchor="middle" fill="#fffaf4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">INSIGHT</text></g>
  <g class="note n3"><circle cx="510" cy="212" r="7" fill="#cdb4db"/><text x="510" y="252" text-anchor="middle" fill="#fffaf4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">CHALLENGE</text></g>
  <g class="note n4"><circle cx="710" cy="194" r="7" fill="#84dcc6"/><text x="710" y="164" text-anchor="middle" fill="#fffaf4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">CONFIDENCE</text></g>
  <circle cx="874" cy="197" r="8" fill="#84dcc6" filter="url(#glow)"/><path d="M868 197l4 4 8-9" fill="none" stroke="#15222a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
