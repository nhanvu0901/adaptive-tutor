<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title description">
  <title id="title">Adaptive Tutor learning loop</title>
  <desc id="description">An animated learning loop: calibrate, map, practice, and prove.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#171540"/>
      <stop offset="100%" stop-color="#10293c"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36d8c7"/>
      <stop offset="50%" stop-color="#9c7cff"/>
      <stop offset="100%" stop-color="#5dd8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid { stroke: #8a9ad9; stroke-width: .65; opacity: .14; }
      .trail { stroke-dasharray: 7 11; animation: flow 2.8s linear infinite; }
      .scanner { animation: sweep 5.4s ease-in-out infinite; }
      .node { transform-box: fill-box; transform-origin: center; }
      .node-one { animation: breathe 4.8s ease-in-out 0s infinite; }
      .node-two { animation: breathe 4.8s ease-in-out 1.2s infinite; }
      .node-three { animation: breathe 4.8s ease-in-out 2.4s infinite; }
      .node-four { animation: breathe 4.8s ease-in-out 3.6s infinite; }
      .spark { animation: blink 1.9s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -72; } }
      @keyframes breathe { 0%, 100% { opacity: .72; } 25%, 45% { opacity: 1; } }
      @keyframes blink { 0%, 100% { opacity: .45; r: 4; } 50% { opacity: 1; r: 7; } }
      @keyframes sweep { 0%, 100% { transform: translateX(-100px); opacity: 0; } 14% { opacity: .16; } 55% { transform: translateX(1020px); opacity: .08; } 72% { opacity: 0; } }
    </style>
  </defs>

  <rect width="960" height="280" rx="20" fill="url(#background)"/>
  <g class="grid">
    <path d="M0 56H960M0 112H960M0 168H960M0 224H960"/>
    <path d="M80 0V280M160 0V280M240 0V280M320 0V280M400 0V280M480 0V280M560 0V280M640 0V280M720 0V280M800 0V280M880 0V280"/>
  </g>
  <rect class="scanner" x="0" y="0" width="95" height="280" fill="#5dd8ff"/>

  <text x="48" y="52" fill="#66e8d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">PERSONAL LEARNING, PROVEN BY EVIDENCE</text>
  <text x="48" y="108" fill="#f4f5ff" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="52" font-weight="700">Adaptive Tutor</text>
  <text x="48" y="142" fill="#c5cae8" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="16">Learn → Explain → Apply → Retain</text>

  <path class="trail" d="M134 210 H266 M350 210 H482 M566 210 H698" fill="none" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round"/>

  <g class="node node-one" filter="url(#glow)">
    <rect x="48" y="178" width="172" height="64" rx="14" fill="#18234b" stroke="#36d8c7" stroke-width="1.4"/>
    <text x="68" y="203" fill="#66e8d6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">01</text>
    <text x="68" y="226" fill="#f4f5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Calibrate</text>
  </g>
  <g class="node node-two" filter="url(#glow)">
    <rect x="264" y="178" width="172" height="64" rx="14" fill="#241d51" stroke="#9c7cff" stroke-width="1.4"/>
    <text x="284" y="203" fill="#b7a4ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">02</text>
    <text x="284" y="226" fill="#f4f5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Map</text>
  </g>
  <g class="node node-three" filter="url(#glow)">
    <rect x="480" y="178" width="172" height="64" rx="14" fill="#17294d" stroke="#5dd8ff" stroke-width="1.4"/>
    <text x="500" y="203" fill="#8ae6ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">03</text>
    <text x="500" y="226" fill="#f4f5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Practice</text>
  </g>
  <g class="node node-four" filter="url(#glow)">
    <rect x="696" y="178" width="172" height="64" rx="14" fill="#18354a" stroke="#66e8d6" stroke-width="1.4"/>
    <text x="716" y="203" fill="#66e8d6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">04</text>
    <text x="716" y="226" fill="#f4f5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Prove</text>
  </g>
  <circle class="spark" cx="902" cy="210" r="4" fill="#66e8d6" filter="url(#glow)"/>
  <text x="888" y="257" fill="#8ee5db" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">SAVED</text>
</svg>
